<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SneakBit</title>
    <!-- The SneakBit page now lives at its own site. GitHub Pages can't do a

         search engines, meta-refresh + JS replace for visitors. -->

    <script>location.replace("https://sneakbit.curzel.it/");</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; margin: 48px; line-height: 1.6; }
    </style>
</head>
<body>
    <p>SneakBit has moved to
        <a href="https://sneakbit.curzel.it/">sneakbit.curzel.it</a>.</p>
</body>
